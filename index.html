<style>
:root {
  --paper: #F2F4F3;
  --panel: #FFFFFF;
  --ink: #172026;
  --ink-2: #56626B;
  --ink-3: #78838A;
  --rule: #D3D9D6;
  --rule-2: #E3E8E5;
  --accent: #2B45B5;
  --accent-soft: #E3E8F8;
  --on-accent: #FFFFFF;
  --ok: #2C7651;
  --ok-bg: #E1EFE7;
  --warn: #93600F;
  --warn-bg: #F5EBD7;
  --crit: #A93A2A;
  --crit-bg: #F6E2DE;
  --font: "Pretendard Subset", "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1316;
    --panel: #151C20;
    --ink: #E3E9E7;
    --ink-2: #9DA9AF;
    --ink-3: #78848B;
    --rule: #2A343A;
    --rule-2: #20292E;
    --accent: #9BACFF;
    --accent-soft: #1D2647;
    --on-accent: #0E1316;
    --ok: #74C79D;
    --ok-bg: #15291F;
    --warn: #E2B062;
    --warn-bg: #2A2113;
    --crit: #F2917F;
    --crit-bg: #2E1B17;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1316;
  --panel: #151C20;
  --ink: #E3E9E7;
  --ink-2: #9DA9AF;
  --ink-3: #78848B;
  --rule: #2A343A;
  --rule-2: #20292E;
  --accent: #9BACFF;
  --accent-soft: #1D2647;
  --on-accent: #0E1316;
  --ok: #74C79D;
  --ok-bg: #15291F;
  --warn: #E2B062;
  --warn-bg: #2A2113;
  --crit: #F2917F;
  --crit-bg: #2E1B17;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.65;
  font-weight: 500;
  letter-spacing: -0.01em;
  padding-inline: 20px;
  padding-block: 0 56px;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1080px; margin-inline: auto; }
.code { font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* 상단 바 */
.bar {
  position: sticky; top: 0; z-index: 5;
  margin-inline: -20px; padding-inline: 20px;
  background: var(--paper);
  background: color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.bar-in { max-width: 1080px; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; padding-block: 12px; }
.brand { margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand-name { font-weight: 800; font-size: 17px; letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
.brand-note { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .02em; }
.filters input { position: absolute; opacity: 0; pointer-events: none; }
.filters input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 공통 머리 */
.meta { margin: 0 0 14px; font-size: 12.5px; font-weight: 600; letter-spacing: .02em; color: var(--ink-3); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; }
.meta span + span::before { content: "/"; margin-inline: 10px; color: var(--rule); }
h1 { font-weight: 800; font-size: clamp(27px, 4.2vw, 40px); line-height: 1.3; letter-spacing: -.03em; margin: 0; text-wrap: balance; }
.lede { font-size: 18px; line-height: 1.7; color: var(--ink-2); margin: 14px 0 0; }
h2 { font-weight: 800; font-size: 24px; line-height: 1.35; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h3 { font-size: 17px; font-weight: 700; line-height: 1.45; margin: 0 0 8px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.tone-ok { color: var(--ok); background: var(--ok-bg); }
.tone-warn { color: var(--warn); background: var(--warn-bg); }
.tone-crit { color: var(--crit); background: var(--crit-bg); }
.tone-info { color: var(--accent); background: var(--accent-soft); }
.jname { font-weight: 700; font-size: 15px; }
.jlevel { font-weight: 500; font-size: 13px; color: var(--ink-3); margin-left: 6px; }
.jpop { font-size: 12.5px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 목차 */
.index-head { padding-block: 40px 26px; }
.filter-bar { display: grid; gap: 10px; margin: 0 0 18px; }
.filters { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.filters-label { font-size: 13.5px; font-weight: 600; color: var(--ink-3); min-width: 2.6em; }
.filters label { padding: 5px 13px; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.filters input:checked + label { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.count { margin-left: 6px; font-weight: 500; opacity: .75; font-variant-numeric: tabular-nums; }
.cases { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.cases.is-ref { border-top: 1px solid var(--rule); }
.case-row { border-bottom: 1px solid var(--rule); }
.case-link { display: grid; grid-template-columns: 168px minmax(0, 1fr) auto; gap: 8px 28px; padding: 22px 6px; color: inherit; text-decoration: none; border-radius: 6px; }
.case-link:hover .case-title { color: var(--accent); }
.case-id { display: grid; align-content: start; gap: 3px; font-size: 12.5px; font-weight: 700; letter-spacing: .02em; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.case-id span + span { font-weight: 600; color: var(--ink-2); letter-spacing: 0; }
.case-title { font-size: 21px; line-height: 1.4; transition: color .15s; }
.is-ref .case-title { font-size: 18px; }
.case-sum { margin: 6px 0 0; font-size: 15px; color: var(--ink-2); }
.case-juris { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13.5px; }
.case-juris li { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.case-go { align-self: center; font-size: 13.5px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.empty { margin: 0; padding: 20px 6px; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); color: var(--ink-3); font-size: 14.5px; }
.group-head { margin: 48px 0 14px; }
.group-head.is-first { margin-top: 28px; }
.group-note { margin: 6px 0 0; font-size: 14.5px; color: var(--ink-2); }

/* 사례 머리 */
.crumb { margin: 0; padding-top: 26px; font-size: 14px; font-weight: 700; }
.crumb a { text-decoration: none; }
.case-head { padding-block: 14px 28px; border-bottom: 1px solid var(--rule); }
.juris { list-style: none; padding: 0; margin: 22px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 10px; }
.juris li { display: grid; justify-items: start; align-content: start; gap: 8px; padding: 12px 16px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; }
.jid { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.case-juris .jid { gap: 8px; }
.impacted { margin: 16px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13.5px; }
.impacted-label { color: var(--ink-3); font-weight: 600; margin-right: 4px; }
.chip { padding: 1px 9px; border: 1px solid var(--rule); border-radius: 999px; color: var(--ink-2); }
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; }
.jump button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-2); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
.jump button:hover { color: var(--accent); border-color: var(--accent); }

/* 섹션 */
.sec { padding-block: 40px 0; scroll-margin-top: 76px; }
.sec-head { margin-bottom: 16px; }
.eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .03em; color: var(--accent); }

/* 비교표 */
.table-scroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; }
.compare { min-width: 660px; table-layout: fixed; }
.compare col.c-label { width: 118px; }
.compare th, .compare td { text-align: left; vertical-align: top; padding: 14px 16px; border-bottom: 1px solid var(--rule-2); font-size: 15px; line-height: 1.6; }
.compare thead th { font-size: 14.5px; font-weight: 700; border-bottom-color: var(--rule); }
.compare tbody th { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.compare tbody tr:last-child > * { border-bottom: 0; }
.compare td + td, .compare th + th { border-left: 1px solid var(--rule-2); }
.na { color: var(--ink-3); }
.cite { font-size: 10.5px; margin-left: 2px; line-height: 0; }
.cite-btn { font: inherit; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 0 1px; cursor: pointer; }
.cite-btn:hover { text-decoration: underline; }

/* 결과 */
.results { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 28px 36px; }
.result { border-top: 2px solid var(--ink); padding-top: 14px; }
.outcome { margin: 0; font-size: 15.5px; }

    {
     "text": "같은 홋카이도의 시카오이는 수소·LP가스·액화바이오메탄처럼 이미 있는 연료 시장을, 오코페는 마을 낙농가가 쓰는 개미산을 노립니다. 농림수산성은 수소는 지방 수요가 없어 어렵고 개미산·메탄올은 반응 속도가 풀리면 유망하다고 봤고, 홋카이도 조사는 공정이 적은 바이오메탄이 비용상 가장 유리하다고 봤습니다.",

<script>

  const BIG = 100000;
  function minPop(c) { return Math.min(...c.jurisdictions.map(j => j.population || Infinity)); }
  function isBig(c) { return minPop(c) > BIG; }
  // 국내 지자체가 한 곳이라도 들어간 사례(해외와 나란히 비교한 것 포함)는 '국내 사례'로 먼저 보여 준다
  const isKR = c => c.jurisdictions.some(j => /^KR/.test(j.code));
  function fmtPop(n) {
    if (n >= 10000) {
      const v = n / 10000;
      return (v >= 100 ? Math.round(v).toLocaleString('ko-KR') : String(Math.round(v * 10) / 10)) + '만';
    }
    return n.toLocaleString('ko-KR') + '명';
  }

  const CASES = JSON.parse(document.getElementById('case-data').textContent)
    .sort((a, b) => (isBig(a) - isBig(b)) || a.id.localeCompare(b.id));

    .sort((a, b) => a.id.localeCompare(b.id));

  };
  const SCALES = [
    ['전체', () => true],
    ['1만 이하', p => p <= 10000],
    ['1~10만', p => p > 10000 && p <= BIG],
    ['10만 초과', p => p > BIG]
  ];
  const SCHEMA = [
    ['id · title · summary_line · summary', '사례 번호, 제목, 제목 아래 한 줄 요약, 설명'],
    ['sector · topic · instrument · impacted', '분야(재생에너지·에너지 효율·대형 건물·사업장 등)와 세부 분야, 정책 수단, 영향 대상'],
    ['jurisdictions[].did', '지자체마다 무엇을 했나 한 줄'],

    ['facts[]', '근거·대상·방식, 제재·지원·배당·재원 등'],
    ['outcome_line', '결과 한 줄'],
    ['metrics[]', '결과 수치와 근거 등급'],
    ['issues[]', '논란·변경·한계·실패'],
    ['timeline[]', '연도별 경과'],

    ['korea_takeaways', '국내 유사 제도와 비교해 볼 점'],
    ['related[]', '연관 사례'],
    ['sources[]', '출처와 근거 등급 A~D']

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let sector = '전체';
  let scale = '전체';
  let schemaOpen = false;
  let refocus = null;
  let data = null;

  // 내려받기: claude.ai 게시 화면에서는 downloads 기능으로 받고,

  let saver;
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads')
      .then(d => { saver = d || null; render(); })

  } else {
    saver = { save: ({ filename, data }) => {
      const url = URL.createObjectURL(new Blob([data], { type: filename.endsWith('.csv') ? 'text/csv' : 'application/json' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return Promise.resolve({ status: 'saved' });
    } };
  }

  const h = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false || kid === '') continue;
      n.append(kid instanceof Node ? kid : String(kid));
    }
    return n;
  };

  const jump = id => {
    const el = document.getElementById(id);
    if (!el) return;
    const isSrc = id.startsWith('src-');
    el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: isSrc ? 'center' : 'start' });
    if (isSrc) {
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1800);
    }
  };
  const cite = ids => {
    if (!ids) return null;
    const list = [].concat(ids);
    return h('sup', { class: 'cite' }, list.map((id, i) => {
      const n = srcNo.get(id) || '?';
      return [i ? ',' : null, h('button', { type: 'button', class: 'cite-btn', 'aria-label': '출처 ' + n + '번 보기', onclick: () => jump('src-' + id) }, String(n))];
    }));
  };
  const grade = g => h('span', { class: 'grade g-' + g, title: '근거 등급 ' + g + ': ' + GRADE[g] }, g);
  // 지표 칸. chart가 있으면 막대그래프('→'·'/'로 이어진 값은 숫자 대신 그래프), % 지표(0~100)는 가로 막대를 함께 그린다
  const toNum = s => {
    let t = String(s).replace(/약|\s/g, ''), n = 0;
    for (const [rx, mul] of [[/^([\d.,]+)억(.*)$/, 1e8], [/^([\d.,]+)만(.*)$/, 1e4]]) {
      const m = t.match(rx);
      if (m) { n += parseFloat(m[1].replace(/,/g, '')) * mul; t = m[2]; }
    }
    return t ? n + (parseFloat(t.replace(/,/g, '')) || 0) : n;
  };
  const pctOf = m => {
    if (!/^%/.test(m.unit || '') || /증가/.test(m.unit)) return null;
    const s = String(m.value).replace(/^약\s*/, '');
    return /^\d+(\.\d+)?$/.test(s) && Number(s) <= 100 ? Number(s) : null;
  };
  const barChart = m => {
    const vals = m.chart.map(([, v]) => toNum(v));
    const max = Math.max(...vals) || 1;
    return h('figure', { class: 'chart', style: '--n:' + m.chart.length, role: 'img',
        'aria-label': m.label + ': ' + m.chart.map(([x, v]) => x + ' ' + v).join(', ') + (m.unit ? ', ' + m.unit : '') },
      m.chart.map(([x, v], i) => h('div', { class: 'pt' },
        h('div', { class: 'plot' }, h('span', { style: '--h:' + (vals[i] / max * 100).toFixed(2) + '%' }, h('b', null, v))),
        h('span', { class: 'x' }, x))));
  };
  const metricItem = (m, tail) => {
    const series = m.chart && /→|\//.test(m.value);
    const p = pctOf(m);
    return h('div', { class: m.chart ? 'metric has-chart' : 'metric' },
      h('dt', null, h('span', null, m.label), grade(m.grade)),
      series ? null : h('dd', null, h('span', { class: 'num' }, m.value), m.unit ? h('span', { class: 'unit' }, m.unit) : null),
      p == null ? null : h('dd', { class: 'meter' + (m.grade === 'D' ? ' is-plan' : ''), 'aria-hidden': 'true' }, h('span', { style: '--p:' + p + '%' })),
      m.chart ? h('dd', { class: 'chart-dd' }, barChart(m)) : null,
      series && m.unit ? h('dd', { class: 'unit-line' }, m.unit) : null,
      h('dd', { class: 'period' }, tail, cite(m.source)));
  };
  const section = (id, field, title, ...body) => h('section', { class: 'sec', id: 'sec-' + id },

  function evidenceCsv() {
    const head = ['구분', 'ID', '제목', '지자체·대상', '인구', '항목', '값', '단위', '기간·측정 주체', '근거 등급',

        (k.model ? k.model + ' · ' : '') + '운영자 권장 · 지자체 계획 아님')))));
    return '\uFEFF' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');

    const m = route.match(/^#\/(.+)$/);
    const id = m && decodeURIComponent(m[1]);
    return (id && (CASES.find(c => c.id === id) || ITEMS.find(c => c.id === id))) || null;
  };
  const go = hash => {
    route = hash;
    try { history.pushState(null, '', hash); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  };
  function render() {
    const c = current();
    document.title = c ? c.title + ' · ' + SITE : SITE;
    const view = !c ? indexView() : ITEMS.includes(c) ? itemView(c) : caseView(c);
    app.replaceChildren(...view.filter(Boolean));
    if (refocus) {
      const el = document.getElementById(refocus);
      if (el) el.focus();
      refocus = null;
    }
  }
  try { localStorage.removeItem('lcc-tier'); } catch (e) {}  // 예전 일반/프로 선택 기억 지우기
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#/"]');
    if (!a || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    go(a.getAttribute('href'));
  });
  const syncFromUrl = () => { route = location.hash; render(); window.scrollTo(0, 0); };
  window.addEventListener('hashchange', syncFromUrl);
  window.addEventListener('popstate', syncFromUrl);
  render();
})();
</script>
